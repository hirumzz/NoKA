<div class="bg-light-grey padding margin-bottom">
    <h4 class="clearfix">
        <i class="mdi mdi-information-outline"></i>
        Route details
    </h4>
</div>

<div ng-if="!user.hasPermission('routes','edit')">
    <div json-human="route" class="table-responsive"></div>
</div>

<form class="form-horizontal" ng-if="user.hasPermission('routes','edit')">
    <div ng-if="Gateway" data-ng-include="partial"></div>
    <div class="form-group">
        <div class="col-sm-offset-3 col-sm-9">
            <button type="button" class="btn btn-primary btn-block" ng-click="submit()">
                <i class="mdi mdi-check"></i>
                Submit changes
            </button>
        </div>
    </div>

</form>

<br>
<hr>
<div class="row">
    <div class="col-md-12">
        <h4 class="margin-bottom-2">Comments</h4>
        
        <div class="comments-list margin-bottom" style="max-height: 400px; overflow-y: auto;">
            <div ng-if="!comments.length" class="text-muted">
                <em>No comments yet.</em>
            </div>
            <div class="media" ng-repeat="comment in comments" style="border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px;">
                <div class="media-left">
                    <img class="media-object img-circle" ng-src="{{comment.user.avatar || 'images/user-profile.png'}}" style="width: 40px; height: 40px; object-fit: cover;">
                </div>
                <div class="media-body">
                    <h5 class="media-heading">
                        <strong>{{comment.user.username || comment.user.firstName}}</strong> 
                        <small class="text-muted">{{moment(comment.createdAt).format("MMM DD YYYY @HH:mm")}}</small>
                        <small class="text-warning" ng-if="comment.updatedAt && comment.updatedAt !== comment.createdAt">(edited)</small>
                    </h5>
                    <!-- Display mode -->
                    <div ng-if="!comment.editing">
                        <p style="white-space: pre-wrap; margin-bottom: 4px;">{{comment.content}}</p>
                        <div style="margin-top: 4px;">
                            <a class="text-muted clickable" style="font-size: 11px; margin-right: 10px;"
                               ng-click="startEditComment(comment)">
                                <i class="mdi mdi-pencil"></i> Edit
                            </a>
                            <a class="text-danger clickable" style="font-size: 11px;"
                               ng-click="deleteComment(comment, $index)">
                                <i class="mdi mdi-delete"></i> Delete
                            </a>
                        </div>
                    </div>
                    <!-- Edit mode -->
                    <div ng-if="comment.editing">
                        <textarea class="form-control" ng-model="comment.editContent" rows="2" style="margin-bottom: 6px;"></textarea>
                        <button class="btn btn-success btn-xs" ng-click="saveEditComment(comment)">Save</button>
                        <button class="btn btn-default btn-xs" ng-click="cancelEditComment(comment)">Cancel</button>
                    </div>
                </div>
            </div>
        </div>

        <div ng-if="user.role === 'admin' || user.admin || user.role === 'commenter'">
            <form ng-submit="addComment()">
                <div class="form-group">
                    <textarea class="form-control" ng-model="newComment.content" placeholder="Add a comment..." rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-sm">Add Comment</button>
            </form>
        </div>
        <div ng-if="!(user.role === 'admin' || user.admin || user.role === 'commenter')" class="text-muted">
            <em>You do not have permission to add comments.</em>
        </div>
    </div>
</div>
