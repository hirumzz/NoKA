<div class="modal-header primary">
    <h5 class="modal-title" id="modal-title">
        {{update ? 'Key Details' : 'Add Key'}}
        <a class="modal-close pull-right" ng-click="close()">
            <i class="mdi mdi-close"></i>
        </a>
    </h5>
</div>
<div class="modal-body" id="modal-body">
    <form class="form-horizontal">
        <div class="form-group" ng-class="{'has-error' : errors.name}">
            <label class="col-sm-4 control-label">Name <span class="text-danger">*</span></label>
            <div class="col-sm-7">
                <input ng-model="data.name" class="form-control" ng-disabled="update" placeholder="e.g. key-name">
                <p class="help-block" ng-if="errors.name">{{errors.name}}</p>
            </div>
        </div>
        <div class="form-group" ng-class="{'has-error' : errors.set}">
            <label class="col-sm-4 control-label">Key Set</label>
            <div class="col-sm-7">
                <select ng-model="data.set" class="form-control" ng-options="set.id as set.name for set in keySets">
                    <option value="">-- No Key Set --</option>
                </select>
                <p class="help-block" ng-if="errors.set">{{errors.set}}</p>
            </div>
        </div>
        <div class="form-group" ng-class="{'has-error' : errors.jwk}">
            <label class="col-sm-4 control-label">JWK (JSON) <span class="text-danger">*</span></label>
            <div class="col-sm-7">
                <textarea ng-model="data.jwk" rows="8" class="form-control" placeholder='{"kty": "RSA", "kid": "key-id", ...}'></textarea>
                <p class="help-block" ng-if="errors.jwk">{{errors.jwk}}</p>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-4 col-sm-7">
                <p class="text-danger" ng-if="errorMessage">{{errorMessage}}</p>
                <button type="submit" class="btn btn-primary btn-block" ng-click="submit()">
                    {{update ? 'Update Key' : 'Add Key'}}
                </button>
            </div>
        </div>
    </form>
</div>
