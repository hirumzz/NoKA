<nav class="navbar navbar-default navbar-main no-margin" data-ng-if="isAuthenticated()">
    <div class="container-fluid">
        <!-- Brand and toggle get grouped for better mobile display -->
        <div class="navbar-header">
            <button type="button" ng-click="toggleSideNav()" class="navbar-toggle hidden-md hidden-lg" aria-expanded="false">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand">
            </a>

        </div>

        <!-- Collect the nav links, forms, and other content for toggling -->
        <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
            <ul class="nav navbar-nav navbar-right">
                <li
                        data-ui-sref-active="active"
                        data-ng-show="!auth.isAuthenticated()"
                >
                    <a  data-ui-sref="auth.login">Login</a>
                </li>

                <!-- NOTIFICATIONS DROPDOWN -->
                <li data-ng-show="auth.isAuthenticated()" uib-dropdown auto-close="outsideClick" keyboard-nav>
                    <a href uib-dropdown-toggle ng-click="markAllRead()">
                        <i class="mdi mdi-bell-outline"></i>
                        <span class="badge badge-danger" ng-show="unreadCount > 0">{{unreadCount}}</span>
                    </a>
                    <ul class="dropdown-menu notifications-dropdown-menu animated fadeInDownShort go" uib-dropdown-menu role="menu" style="min-width: 350px; max-width: 400px; max-height: 400px; overflow-y: auto; right: 0; left: auto;">

                        <li role="menuitem" ng-if="!notifications.length">
                            <a style="white-space: normal; padding: 10px 15px;">
                                There are no notifications at this point...
                            </a>
                        </li>
                        <li role="menuitem" ng-repeat="notification in notifications" style="border-bottom: 1px solid #f0f0f0;">
                            <a class="clickable" ng-click="onClickNotification(notification, $index)" style="display: flex; align-items: flex-start; padding: 10px 15px; white-space: normal;">
                                <i class="mdi mdi-18px {{notification.icon || 'mdi-message'}} text-info" style="margin-top: 2px; margin-right: 8px; flex-shrink: 0;"></i>
                                <span style="flex: 1; font-size: 12px; line-height: 1.4; word-wrap: break-word;">{{notification.message}}</span>
                                <i class="mdi mdi-close text-muted clickable" ng-click="removeNotification($index); $event.stopPropagation();" style="margin-left: 8px; flex-shrink: 0;"></i>
                            </a>
                        </li>

                    </ul>
                </li>
                <!-- END NOTIFICATIONS DROPDOWN -->

                <!-- PROFILE DROPDOWN -->
                <li data-ng-show="auth.isAuthenticated() && !no_auth" uib-dropdown keyboard-nav>
                    <a class="nav-auth-img-container" uib-dropdown-toggle>
                        <img class="nav-auth-img" ng-src="{{user().avatar || 'images/user-icon.png'}}"/>
                        &nbsp;
                        <span class="greeting visible-md-inline visible-lg-inline">Hello, {{user().firstName || user().username}}</span>
                        <span class="caret"></span>
                    </a>
                    <ul class="dropdown-menu animated fadeInDownShort go"
                        ng-if="!no_auth"
                        uib-dropdown-menu role="menu" aria-labelledby="simple-btn-keyboard-nav">

                        <li role="menuitem">
                            <a data-ui-sref="users.show({id:user().id})">
                                <i class="mdi mdi-account-outline"></i>
                                Profile
                            </a>
                        </li>
                        <li role="menuitem" ng-if="user().admin">
                            <a data-ui-sref="users">
                                <i class="mdi mdi-account-multiple"></i>
                                Users
                            </a>
                        </li>
                        <li role="menuitem">
                            <a data-ui-sref="settings" ng-if="user().admin">
                                <i class="mdi mdi-settings"></i>
                                Settings
                            </a>
                        </li>
                        <li class="divider"></li>
                        <li role="menuitem">
                            <a  data-ng-click="logout()">
                                <i class="mdi mdi-logout-variant"></i>
                                Logout
                            </a>
                        </li>
                    </ul>

                </li>
                <!-- END PROFILE DROPDOWN -->
            </ul>
        </div><!-- /.navbar-collapse -->
    </div><!-- /.container-fluid -->
</nav>
