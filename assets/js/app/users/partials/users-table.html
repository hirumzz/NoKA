<table class="table table-hover table-striped">
    <tr>
        <th width="1"></th>
        <th>USERNAME</th>
        <th>FIRST NAME</th>
        <th>LAST NAME</th>
        <th>ROLE</th>
        <th class="clickable" ng-click="changeSort({column:'createdAt'})">
            CREATED
            <i class="mdi" ng-show="sort.column == 'createdAt'" ng-class="{'mdi-chevron-down': !sort.direction, 'mdi-chevron-up': sort.direction}"></i>
        </th>
        <th class="clickable" ng-click="changeSort({column:'updatedAt'})">
            UPDATED
            <i class="mdi" ng-show="sort.column == 'updatedAt'" ng-class="{'mdi-chevron-down': !sort.direction, 'mdi-chevron-up': sort.direction}"></i>
        </th>
        <th width="1" ng-if="user.hasPermission($state.name.split('.')[0],'delete')"></th>
    </tr>
    <tr data-ng-repeat="item in items">
        <td>
            <i class="mdi" ng-class="{'text-warning mdi-crown': item.admin,'text-muted mdi-account-outline' : !item.admin}"></i>
        </td>
        <td><a data-ui-sref="users.show({id: item.id})">{{item.username}}</a></td>
        <td>{{item.firstName}}</td>
        <td>{{item.lastName}}</td>
        <td>
            <span class="label" ng-class="{'label-danger': item.admin, 'label-info': item.role === 'commenter', 'label-default': !item.admin && item.role !== 'commenter'}">
                {{item.role || (item.admin ? 'admin' : 'viewer')}}
            </span>
        </td>
        <td>{{item.createdAt | date : "MMM d, y"}}</td>
        <td>{{item.updatedAt | date : "MMM d, y"}}</td>
        <td ng-if="user.hasPermission($state.name.split('.')[0],'delete')">
            <button type="button" ng-click="deleteUser($index,item)"
                    data-ng-disabled="item.id === user.id"
                    class="btn btn-danger btn-link">
                <i class="mdi mdi-delete"></i>
                Delete
            </button>
        </td>
    </tr>

    <tr data-ng-if="items.length === 0">
        <td colspan="100%" class="text-center text-muted">
            <em>no data found...</em>
        </td>
    </tr>
</table>

<ul uib-pagination
    class="pagination"
    data-total-items="itemCount"
    data-ng-model="paging.currentPage"
    data-ng-change="pageChanged()"
    data-items-per-page="itemsPerPage"
    data-max-size="10"
    data-boundary-links="true"
    data-rotate="false"
></ul>
